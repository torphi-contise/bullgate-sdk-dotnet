name: Bug report
description: Report reproducible incorrect SDK behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, tokens, store proofs, or personal data.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Bullgate.Access.AspNetCore
        - Bullgate.Billing.AspNetCore
        - Repository tooling or documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: .NET SDK, operating system, hosting model, and relevant redacted configuration.
