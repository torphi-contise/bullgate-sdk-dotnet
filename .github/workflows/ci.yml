name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-pack:
    name: Build, test, analyze and pack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set up JDK 21
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: 21
          distribution: zulu

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400

      - name: Cache SonarQube Cloud packages
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && steps.cache-sonar-scanner.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          New-Item -Path "${{ runner.temp }}/scanner" -ItemType Directory -Force
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      - name: Restore dependencies
        run: dotnet restore Bullgate.Sdk.DotNet.slnx

      - name: Begin SonarQube analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          & "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin `
            /k:"torphi-contise_bullgate-sdk-dotnet" `
            /o:"torphi-contise" `
            /d:sonar.cs.opencover.reportsPaths="TestResults/**/coverage.opencover.xml" `
            /d:sonar.cs.vstest.reportsPaths="TestResults/**/*.trx"

      - name: Build
        run: dotnet build Bullgate.Sdk.DotNet.slnx --configuration Release --no-restore --no-incremental

      - name: Test with coverage
        shell: pwsh
        run: |
          dotnet test Bullgate.Sdk.DotNet.slnx `
          --configuration Release `
          --no-build `
          --logger "trx" `
          --results-directory TestResults `
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: End SonarQube analysis
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: '& "${{ runner.temp }}/scanner/dotnet-sonarscanner" end'

      - name: Pack
        run: dotnet pack Bullgate.Sdk.DotNet.slnx --configuration Release --no-build --output artifacts/packages

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-packages
          path: artifacts/packages
          if-no-files-found: error
